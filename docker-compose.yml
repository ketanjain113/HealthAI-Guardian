version: '3.8'

services:
  # MongoDB for local development
  mongodb:
    image: mongo:6.0
    container_name: healthai-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: healthai-guardian
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Model API service (Python Flask)
  model-api:
    build:
      context: ./Model
      dockerfile: Dockerfile
    container_name: healthai-models
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      FLASK_APP: ModelAPI.py
    volumes:
      - ./Model:/app
    depends_on:
      - mongodb

  # Backend API service (Node.js Express)
  backend-api:
    build:
      context: ./Root/Backend
      dockerfile: Dockerfile
    container_name: healthai-backend
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: 8080
      MONGO_URI: mongodb://mongodb:27017/healthai-guardian
      MODEL_API_URL: http://model-api:5000
      PREDICTION_API: http://model-api:5000/api/diagnose
      JWT_SECRET: dev-secret-key-change-in-production
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./Root/Backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
      - model-api

  # Frontend service (React + Nginx)
  frontend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: healthai-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080
      REACT_APP_MODEL_API_URL: http://localhost:5000
    depends_on:
      - backend-api

volumes:
  mongodb_data:

networks:
  default:
    name: healthai-network
